<div class="card shadow-sm border-0 p-3">

  <h4 class="mb-3">Available Products</h4>

  <div class="row g-3">

    @for (product of products; track product.id) {
      <div class="col-md-6">
        <app-product-card [product]="product" (addToCart)="addToCart.emit($event)" [isAdded]="cartItems.some(item => item.id === product.id)"></app-product-card>
      </div>
    }

  </div>

</div>
